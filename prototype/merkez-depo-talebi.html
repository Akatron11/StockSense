<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSense — Merkez Depo Talebi (wireframe)</title>
<link rel="stylesheet" href="app.css">
<style>
  .req .thead,.req .trow{grid-template-columns:2fr 1fr 1fr 1fr;}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">LOGO</div>
    <div class="rail-role">Stock Manager</div>
    <ul class="nav">
      <li><span class="ic"></span> Stok listesi</li>
      <li class="active"><span class="ic"></span> Merkez depo talebi</li>
    </ul>
    <div class="rail-spacer"></div>
    <div class="rail-user"><div class="avatar"></div><div class="who"><span class="bar w85 h12"></span><span class="bar w60"></span></div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">Merkez depo talebi</div>
      <div class="topbar-right">
        <span class="brand-slot">marka alanı (subdomain)</span>
        <div class="usermenu" id="usermenu">
          <div class="avatar" onclick="toggleClass('usermenu')"></div>
          <div class="usermenu-pop"><div class="um-head"><span class="bar w85 h12"></span><span class="bar w60"></span></div>
            <div class="um-div"></div>
            <div class="um-row">Dil / Language <span class="um-lang"><span class="on">TR</span><span class="sep"></span><span>EN</span></span></div>
            <div class="um-div"></div><div class="um-row">Çıkış</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content req">
      <div class="scope">Şube stoğu yetersizse ürün merkez depodan getirtilir (fiziksel lojistik kapsam dışı)</div>

      <div class="grid2">
        <div class="panel">
          <div class="panel-head">Yeni talep</div>
          <div class="panel-body">
            <div class="field" style="margin-bottom:14px"><label>Ürün</label><input class="input" placeholder="Ürün ara / SKU"></div>
            <div class="field" style="margin-bottom:14px"><label>Miktar</label><input class="input" placeholder="0"></div>
            <button class="btn primary block">Talep oluştur</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">Talepler</div>
          <div class="panel-body">
            <div class="thead"><span>Ürün</span><span>Miktar</span><span>Tarih</span><span>Durum</span></div>
            <div class="trow"><span class="bar w70 h12"></span><span class="bar w40"></span><span class="bar w50"></span><span class="pill">bekliyor</span></div>
            <div class="trow"><span class="bar w85 h12"></span><span class="bar w40"></span><span class="bar w50"></span><span class="pill">geldi</span></div>
            <div class="trow"><span class="bar w60 h12"></span><span class="bar w40"></span><span class="bar w50"></span><span class="pill">bekliyor</span></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
